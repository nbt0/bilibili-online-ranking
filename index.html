<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站视频实时在线人数排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            min-width: 1000px;
            background-color: #fff;
            color: #222;
            font-size: 12px;
        }
        
        .container {
            width: 1160px;
            margin: 0 auto;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .site-header {
            padding-top: 64px;
            background: #fff;
        }

        .banner-stage {
            position: relative;
            height: 160px;
            overflow: hidden;
            background: linear-gradient(180deg, #4b95d2 0%, #aeeef5 100%);
        }

        .banner-layers {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .banner-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        .banner-layer img,
        .banner-layer video {
            max-width: none;
            pointer-events: none;
            user-select: none;
        }

        .legacy-topbar {
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: #18191c;
            font-size: 14px;
            text-shadow: none;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(12px);
        }

        .top-nav-left,
        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
            white-space: nowrap;
        }

        .top-nav-left {
            flex: 1 1 auto;
            min-width: 0;
        }

        .mini-header-brand {
            min-width: 100px;
            height: 40px;
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 8px;
            color: #24292f;
            font-size: 15px;
            font-weight: 600;
        }

        .mini-header-brand svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .mini-header-brand:hover {
            color: #57606a;
        }

        .top-nav-link {
            transition: color 0.15s ease;
        }

        .top-nav-link:hover {
            color: #00aeec;
        }

        .header-search {
            width: min(360px, 28vw);
            height: 38px;
            display: flex;
            flex: 0 0 auto;
            overflow: hidden;
            border: 1px solid #e3e5e7;
            border-radius: 8px;
            background: #f1f2f3;
        }

        .search-box {
            width: 100%;
            min-width: 0;
            padding: 0 14px;
            border: 0;
            outline: 0;
            background: transparent;
            color: #222;
            font-size: 13px;
        }

        .header-search button {
            width: 48px;
            flex: 0 0 48px;
            border: 0;
            border-left: 1px solid #e7e7e7;
            background: transparent;
            color: #505050;
            cursor: pointer;
        }

        .header-search button:hover {
            background: #e3e5e7;
        }

        .header-search svg {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            fill: currentColor;
        }

        .project-link {
            min-width: 58px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 12px;
            border-radius: 8px;
            background: #24292f;
            color: #fff;
            font-size: 13px;
            transition: background 0.15s ease;
        }

        .project-link:hover {
            background: #57606a;
        }

        .submit-link {
            width: 72px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            background: #fb7299;
            color: #fff;
            font-size: 15px;
            text-shadow: none;
        }

        .channel-shell {
            height: 108px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
        }

        .channel-nav {
            width: 1160px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .round-nav {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 16px;
        }

        .round-nav-item {
            min-width: 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #222;
            font-size: 14px;
        }

        .round-nav-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            transition: transform 0.15s ease;
        }

        .round-nav-item:hover .round-nav-icon {
            transform: translateY(-2px);
        }

        .round-home { background: #fb7299; }
        .round-dynamic { background: #ffb11b; }
        .round-popular { background: #f45a66; }
        .round-channel { background: #6dc781; }

        .category-grid {
            flex: 1 1 auto;
            min-width: 0;
            display: grid;
            grid-template-columns: repeat(8, auto);
            grid-template-rows: repeat(2, 24px);
            grid-auto-flow: column;
            align-content: center;
            justify-content: space-between;
            gap: 12px 16px;
        }

        .category-link,
        .special-link {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            font-size: 13px;
            transition: color 0.15s ease;
        }

        .category-link:hover,
        .special-link:hover {
            color: #00a1d6;
        }

        .category-badge {
            min-width: 26px;
            height: 14px;
            margin-left: 3px;
            padding: 0 3px;
            border-radius: 2px;
            background: #73c9e5;
            color: #fff;
            font-size: 9px;
            line-height: 14px;
            text-align: center;
        }

        .special-grid {
            flex: 0 0 238px;
            padding-left: 20px;
            border-left: 1px solid #e7e7e7;
            display: grid;
            grid-template-columns: repeat(3, auto);
            grid-template-rows: repeat(2, 24px);
            grid-auto-flow: column;
            align-content: center;
            justify-content: space-between;
            gap: 12px 13px;
        }

        .special-icon {
            width: 17px;
            height: 17px;
            margin-right: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            background: #73c9e5;
            color: #fff;
            font-size: 11px;
        }

        .list-heading {
            height: 67px;
            margin-top: 20px;
            padding-bottom: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e5e9ef;
        }

        .list-heading-icon {
            width: 25px;
            height: 25px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: #f25d8e;
            color: #fff;
        }

        .list-heading-icon svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .list-heading h1 {
            font-size: 18px;
            font-weight: 400;
            line-height: 25px;
        }

        .list-heading p {
            margin-left: 8px;
            color: #99a2aa;
            font-size: 13px;
            line-height: 25px;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(5, 210px);
            justify-content: center;
            gap: 15px 25px;
            max-width: 1160px;
            margin: 15px auto 0;
        }
        
        .video-card {
            background-color: #fff;
            border: 1px solid #e5e9ef;
            border-radius: 4px;
            overflow: hidden;
            cursor: default;
            transition: border-color 0.2s ease;
        }

        .video-card:hover {
            border-color: #ccd0d7;
        }

        .video-title:hover {
            color: #00a1d6;
        }

        .video-card:hover .online-count strong {
            color: #f25d8e;
        }
        
        .video-thumbnail {
            position: relative;
            display: block;
            width: 100%;
            height: 142px;
            overflow: hidden;
            background-color: #f1f2f3;
            cursor: pointer;
        }
        
        .video-thumbnail img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
        
        .video-info {
            min-height: 97px;
            padding: 8px 14px;
        }
        
        .video-title {
            height: 40px;
            margin-bottom: 8px;
            color: #222;
            cursor: pointer;
            font-size: 12px;
            font-weight: 400;
            line-height: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.1s linear;
        }
        
        .video-meta {
            display: grid;
            grid-template-columns: 90px 90px;
            color: #99a2aa;
            font-size: 12px;
            line-height: 12px;
        }

        .video-stat {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
        }

        .video-stat svg {
            width: 12px;
            height: 12px;
            flex: 0 0 auto;
            fill: currentColor;
        }

        .video-stat span {
            cursor: text;
            user-select: text;
        }
        
        .video-owner {
            display: block;
            margin-top: 5px;
            color: #99a2aa;
            font-size: 12px;
            line-height: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s ease;
        }
        
        .video-owner:hover {
            color: #00a1d6;
        }
        
        .online-count {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            background-color: #e5e9ef;
            color: #333;
            cursor: default;
            font-size: 12px;
            line-height: 30px;
            user-select: none;
        }

        .online-count strong {
            color: #111;
            cursor: text;
            font-size: 14px;
            font-weight: 700;
            transition: color 0.1s linear;
            user-select: text;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #ff4d4f;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }
        
        .update-time {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        @media (max-width: 1400px) {
            .container,
            .channel-nav {
                width: 980px;
            }

            .top-nav-optional {
                display: none;
            }

            .channel-nav {
                gap: 20px;
            }

            .round-nav {
                gap: 12px;
            }

            .category-grid {
                gap: 12px 10px;
            }

            .special-grid {
                flex-basis: 210px;
                padding-left: 16px;
                gap: 12px 9px;
            }

            .video-grid {
                grid-template-columns: repeat(4, 210px);
                column-gap: 44px;
                max-width: 980px;
            }
        }

        @media (max-width: 1000px) {
            body {
                min-width: 0;
            }

            .container,
            .channel-nav {
                width: auto;
                margin-left: 20px;
                margin-right: 20px;
            }

            .legacy-topbar {
                padding: 0 16px;
            }

            .top-nav-left .top-nav-link:not(:first-child),
            .top-nav-right .top-nav-link,
            .special-grid {
                display: none;
            }

            .header-search {
                width: min(420px, 52vw);
            }

            .channel-shell {
                height: 92px;
            }

            .channel-nav {
                gap: 18px;
                overflow: hidden;
            }

            .category-grid {
                min-width: 630px;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fit, 210px);
                gap: 15px 25px;
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .site-header {
                padding-top: 56px;
            }

            .legacy-topbar {
                height: 56px;
            }

            .video-grid {
                gap: 16px;
            }

            .banner-stage {
                height: 145px;
            }

            .top-nav-left {
                display: none;
            }

            .header-search {
                width: 100%;
            }

            .submit-link {
                display: none;
            }

            .channel-shell {
                display: none;
            }

            .list-heading p {
                display: none;
            }
        }
    </style>
</head>

    <script>
        localStorage.removeItem('bilibili-account-cache-v1');

        const bannerStage = document.getElementById('banner-stage');
        const bannerLayersElement = document.getElementById('banner-layers');
        const bannerLayerState = [];
        let bannerOriginX = 0;
        let bannerOffsetX = 0;
        let bannerFrame = 0;
        let bannerResizeTimer = 0;

        function getBannerScale() {
            return Math.max(1, window.innerWidth / 1650);
        }

        function createBannerLayers(data) {
            const scale = getBannerScale();
            bannerLayersElement.innerHTML = '';
            bannerLayerState.length = 0;

            data.forEach((item) => {
                const layer = document.createElement('div');
                const media = document.createElement(item.tagName === 'video' ? 'video' : 'img');
                const matrix = Array.isArray(item.transform) ? [...item.transform] : [1, 0, 0, 1, 0, 0];

                matrix[4] *= scale;
                matrix[5] *= scale;
                layer.className = 'banner-layer';
                layer.style.opacity = Array.isArray(item.opacity) ? item.opacity[0] : 1;

                media.src = item.src;
                media.style.width = `${item.width * scale}px`;
                media.style.height = `${item.height * scale}px`;
                media.draggable = false;

                if (media.tagName === 'VIDEO') {
                    media.autoplay = true;
                    media.loop = true;
                    media.muted = true;
                    media.playsInline = true;
                }

                layer.appendChild(media);
                bannerLayersElement.appendChild(layer);
                bannerLayerState.push({
                    element: layer,
                    matrix,
                    depth: Number(item.a) || 0
                });
            });

            updateBannerLayers();
        }

        function updateBannerLayers() {
            bannerFrame = 0;
            bannerLayerState.forEach(({ element, matrix, depth }) => {
                const nextMatrix = [...matrix];
                nextMatrix[4] += bannerOffsetX * depth;
                element.style.transform = `matrix(${nextMatrix.join(',')})`;
            });
        }

        function requestBannerUpdate() {
            if (!bannerFrame) {
                bannerFrame = requestAnimationFrame(updateBannerLayers);
            }
        }

        async function initializeBanner() {
            try {
                const response = await fetch('assets/2026-04-27/data.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                createBannerLayers(await response.json());
            } catch (error) {
                console.warn('本地横幅素材加载失败，已使用渐变背景：', error.message);
            }
        }

        bannerStage.addEventListener('mouseenter', (event) => {
            bannerOriginX = event.clientX;
        });

        bannerStage.addEventListener('mousemove', (event) => {
            bannerOffsetX = event.clientX - bannerOriginX;
            requestBannerUpdate();
        });

        bannerStage.addEventListener('mouseleave', () => {
            bannerOffsetX = 0;
            bannerLayerState.forEach(({ element }) => {
                element.style.transition = 'transform 300ms ease-out';
            });
            requestBannerUpdate();
            setTimeout(() => {
                bannerLayerState.forEach(({ element }) => {
                    element.style.transition = '';
                });
            }, 320);
        });

        window.addEventListener('resize', () => {
            clearTimeout(bannerResizeTimer);
            bannerResizeTimer = setTimeout(initializeBanner, 160);
        });

        document.getElementById('search-focus').addEventListener('click', () => {
            document.querySelector('.search-box').focus();
        });

        // 获取DOM元素
        const videoContainer = document.getElementById('video-container');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const searchBox = document.querySelector('.search-box');
        
        // 存储视频数据
        let videosData = [];
        let currentSort = 'count';
        let searchTerm = '';
        
        // 加载JSON数据
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error('无法加载数据，请确保data.json文件存在且格式正确');
                }
                
                // 获取data.json的最后修改时间
                const lastModified = response.headers.get('last-modified');
                const updateTime = lastModified 
                    ? new Date(lastModified).toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    })
                    : '未知';
                
                const data = await response.json();
                
                // 将对象转换为数组并添加BV号
                videosData = Object.entries(data).map(([bvid, info]) => {
                    // 确保pic字段使用https协议
                    if (info.pic && info.pic.startsWith('http:')) {
                        info.pic = info.pic.replace('http://', 'https://');
                    }
                    return {
                        bvid,
                        ...info
                    };
                });
                
                document.getElementById('update-time').textContent = updateTime;
                
                // 初始排序
                sortVideos(currentSort);
                
                // 渲染视频
                renderVideos();
            } catch (error) {
                videoContainer.innerHTML = `<div class="error">加载数据失败: ${error.message}</div>`;
                console.error('加载数据失败:', error);
            }
        }
        
        // 排序视频
        function sortVideos(sortBy) {
            currentSort = sortBy;
            
            switch (sortBy) {
                case 'count':
                    videosData.sort((a, b) => b.count_num - a.count_num);
                    break;
                case 'title':
                    videosData.sort((a, b) => a.title.localeCompare(b.title, 'zh-CN'));
                    break;
                case 'owner':
                    videosData.sort((a, b) => a.owner.localeCompare(b.owner, 'zh-CN'));
                    break;
            }
            
            // 更新排序按钮状态
            sortButtons.forEach(btn => {
                if (btn.dataset.sort === sortBy) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 过滤视频
        function filterVideos() {
            if (!searchTerm) {
                return videosData;
            }
            
            const term = searchTerm.toLowerCase();
            return videosData.filter(video => 
                video.title.toLowerCase().includes(term) || 
                video.owner.toLowerCase().includes(term)
            );
        }

        // 将播放量、弹幕量转换为参考页面使用的紧凑格式
        function formatStatCount(value) {
            const count = Number(value);

            if (!Number.isFinite(count) || count < 0) {
                return '0';
            }

            if (count >= 100000000) {
                return `${(count / 100000000).toFixed(1).replace(/\.0$/, '')}亿`;
            }

            if (count >= 10000) {
                return `${(count / 10000).toFixed(1).replace(/\.0$/, '')}万`;
            }

            return Math.floor(count).toString();
        }

        const defaultCoverUrl =
            'https://i0.hdslb.com/bfs/archive/67db4a6eae398c309244e74f6e85ae8d813bd7c9.jpg';

        function getLowResolutionCoverUrl(value) {
            const source = typeof value === 'string' && value ? value : defaultCoverUrl;
            const secureSource = source.replace(/^http:\/\//, 'https://');
            const baseUrl = secureSource.split('?')[0].split('@')[0];
            return `${baseUrl}@208w.webp`;
        }
        
        // 渲染视频列表
        function renderVideos() {
            const filteredVideos = filterVideos();
            
            if (filteredVideos.length === 0) {
                videoContainer.innerHTML = '<div class="no-results">没有找到匹配的视频</div>';
                return;
            }
            
            let html = '';
            
            filteredVideos.forEach(video => {
                const coverUrl = getLowResolutionCoverUrl(video.pic);
                const fallbackCoverUrl = getLowResolutionCoverUrl(defaultCoverUrl);
                
                html += `
                    <div class="video-card">
                        <a class="video-thumbnail"
                           href="https://www.bilibili.com/video/${video.bvid}"
                           target="_blank"
                           rel="noopener noreferrer">
                            <img src="${coverUrl}" 
                                 alt="${video.title}" 
                                 referrerpolicy="no-referrer"
                                 onerror="this.onerror=null; this.src='${fallbackCoverUrl}'">
                        </a>
                        <div class="video-info">
                            <a class="video-title"
                               href="https://www.bilibili.com/video/${video.bvid}"
                               target="_blank"
                               rel="noopener noreferrer">
                                ${video.title}
                            </a>
                            <div class="video-meta">
                                <span class="video-stat" title="播放量 ${formatStatCount(video.view)}">
                                    <svg viewBox="0 0 16 16" aria-hidden="true">
                                        <path d="M2.25 2.5h11.5A1.75 1.75 0 0 1 15.5 4.25v7.5a1.75 1.75 0 0 1-1.75 1.75H2.25A1.75 1.75 0 0 1 .5 11.75v-7.5A1.75 1.75 0 0 1 2.25 2.5Zm4 3.05v4.9L10.5 8 6.25 5.55Z"/>
                                    </svg>
                                    <span>${formatStatCount(video.view)}</span>
                                </span>
                                <span class="video-stat" title="弹幕量 ${formatStatCount(video.danmaku)}">
                                    <svg viewBox="0 0 16 16" aria-hidden="true">
                                        <path d="M2.25 2.5h11.5A1.75 1.75 0 0 1 15.5 4.25v7.5a1.75 1.75 0 0 1-1.75 1.75H2.25A1.75 1.75 0 0 1 .5 11.75v-7.5A1.75 1.75 0 0 1 2.25 2.5ZM3.5 5.25v1.2h9v-1.2h-9Zm0 2.15v1.2h5.75V7.4H3.5Zm0 2.15v1.2h7.25v-1.2H3.5Z"/>
                                    </svg>
                                    <span>${formatStatCount(video.danmaku)}</span>
                                </span>
                            </div>
                            <a class="video-owner"
                               href="https://space.bilibili.com/${video.mid}"
                               target="_blank"
                               rel="noopener noreferrer"
                               title="${video.owner}">
                                ${video.owner}
                            </a>
                        </div>
                        <div class="online-count">
                            <strong>${video.online_count}</strong>
                            <span>人在看</span>
                        </div>
                    </div>
                `;
            });
            
            videoContainer.innerHTML = html;
        }
        
        // 事件监听
        sortButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                sortVideos(btn.dataset.sort);
                renderVideos();
            });
        });
        
        searchBox.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderVideos();
        });
        
        // 自动刷新数据(每5分钟)
        setInterval(loadData, 300000);
        
        // 初始加载数据
        initializeBanner();
        loadData();
    </script>
</body>
</html>
