name: Update Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ranking-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install requests

    - name: Run tests
      run: python -m unittest -v

    - name: Run data collection
      run: python video_ranking.py

    - name: Validate public data
      shell: python
      run: |
        import json
        from pathlib import Path

        data = json.loads(Path("data.json").read_text(encoding="utf-8"))
        if not isinstance(data, dict) or not 1 <= len(data) <= 100:
            raise SystemExit("data.json must contain 1 to 100 videos")

        allowed = {
            "cid",
            "title",
            "pic",
            "owner",
            "mid",
            "view",
            "danmaku",
            "online_count",
            "count_num",
            "url",
            "updated_at",
        }
        online_values = []
        for bvid, record in data.items():
            if not isinstance(record, dict) or set(record) != allowed:
                raise SystemExit(f"unexpected public fields for {bvid}")
            if not str(record["online_count"]).isdigit():
                raise SystemExit(f"invalid online_count for {bvid}")
            if int(record["online_count"]) != record["count_num"]:
                raise SystemExit(f"online count mismatch for {bvid}")
            online_values.append(record["count_num"])

        if online_values != sorted(online_values, reverse=True):
            raise SystemExit("data.json is not sorted by online count")

        print(f"Validated {len(data)} public videos")

    - name: Build public site
      run: |
        mkdir -p dist
        cp index.html data.json dist/
        cp -R assets dist/assets

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
