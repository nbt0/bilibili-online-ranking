name: Update Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ranking-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout public source
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Checkout enrichment source
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.PRIVATE_REPOSITORY }}
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        path: _private
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install -r _private/requirements.txt

    - name: Run public tests
      run: python -B -X utf8 -m unittest -v

    - name: Run enrichment tests
      run: python -B -X utf8 -m unittest discover -s _private/tests -v

    - name: Build public ranking draft
      run: >-
        python -B -X utf8 video_ranking.py
        --output _work/public-ranking.json
        --previous-data data.json

    - name: Validate public ranking draft
      run: >-
        python -B -X utf8 validate_public_data.py
        _work/public-ranking.json

    - name: Build enriched ranking
      run: >-
        python -B -X utf8 _private/scripts/build_final.py
        --public-input _work/public-ranking.json
        --output _work/final-data.json

    - name: Validate final public data
      run: >-
        python -B -X utf8 validate_public_data.py
        _work/public-ranking.json
        _work/final-data.json

    - name: Build public site
      run: |
        mkdir -p dist
        cp index.html dist/index.html
        cp _work/final-data.json dist/data.json
        cp -R assets dist/assets

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
